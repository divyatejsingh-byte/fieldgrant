# Render blueprint for FieldGrant (sandbox prototype), FREE instance. No card needed to try it (check at signup).
#
# FREE-TIER ARCHITECTURE: free web services have an EPHEMERAL filesystem and cannot attach a persistent disk. The database and
# uploads therefore live in /tmp: they are wiped on every restart, redeploy and after 15 idle minutes (the service then sleeps for
# about a minute on the next request). The app reseeds the demo automatically on boot, so it is never empty. Capture your demo
# screenshots (a Scenario 1 payout, the PayPal webhook event log) before the service goes idle.
# For data that survives restarts use render.paid.yaml (Starter plan + persistent disk at /var/data).
#
# Secrets (sync: false) are entered in the Render dashboard, never in this file. Values below mirror .env.example.
services:
  - type: web
    name: fieldgrant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # 200 only when SQLite accepts a timed write and the uploads folder is writable (see /api/health).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Ephemeral but always writable on Render. The header badge reports "no persistent disk" so nothing is overstated.
      - key: DATABASE_PATH
        value: /tmp/fieldgrant.sqlite
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_BYTES
        value: "8388608"
      - key: DEMO_RESET_ENABLED
        value: "true"
      # AI provider: Gemini by default; Anthropic is an optional alternative.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # PayPal SANDBOX only. The app refuses other hosts.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Sandbox recipient (Personal) account emails, one per seeded organization.
      - key: NGO1_PAYPAL_EMAIL
        sync: false
      - key: NGO2_PAYPAL_EMAIL
        sync: false
      - key: NGO3_PAYPAL_EMAIL
        sync: false
      # Optional: shows the GitHub link on the landing page.
      - key: NEXT_PUBLIC_GITHUB_URL
        value: https://github.com/divyatejsingh-byte/fieldgrant
