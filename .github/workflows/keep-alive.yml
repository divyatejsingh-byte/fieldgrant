# Keep the free Render demo awake while the hackathon is being judged.
# Render's free instance sleeps after 15 idle minutes (a cold start takes about a minute and the demo database reseeds), so this
# opens the health endpoint every 10 minutes during the judging period (2 to 15 December 2026; the window below adds a margin
# for time zones) and does nothing outside it. GitHub's scheduler is best-effort, so a second pinger also runs elsewhere.
# It makes a plain GET request to our own public demo URL and uses no secrets.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC); GitHub may start a run a few minutes late
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the demo (judging period, 2 to 15 Dec 2026)
        run: |
          start=$(date -u -d "2026-12-01T10:00:00Z" +%s)
          end=$(date -u -d "2026-12-16T12:00:00Z" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$start" ] || [ "$now" -ge "$end" ]; then
            echo "Outside the keep-alive window ($(date -u +%FT%TZ)); nothing to do."
            exit 0
          fi
          # A sleeping instance needs up to about a minute to wake, so allow a long timeout and a few retries.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "health check: HTTP %{http_code} in %{time_total}s\n" \
            https://fieldgrant.onrender.com/api/health
